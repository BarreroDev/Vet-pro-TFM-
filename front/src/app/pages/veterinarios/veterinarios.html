<app-top-bar></app-top-bar>


<div class="btn-continer" >
  <button type="button" (click)="openRegistrer()">
    + Nueva Veterinario
  </button>
</div>

@if (isRegistrerOpen){
  <app-new-vet (close)="closeRegistrer()" ></app-new-vet>
}

<div class="cards-grid">
  @for (v of listaVeterinarios; track v.id || v.numeroColegiado) {
    <app-vet-card [vet]="v"></app-vet-card>
  } @empty {
    @if (!cargando) {
      <p class="no-data">No hay veterinarios registrados actualmente.</p>
    }
  }
</div>
