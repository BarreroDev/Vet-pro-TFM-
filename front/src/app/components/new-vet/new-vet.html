

<div class="backdrop">
  <div class="card-singup">
    <div class="singup-header">
      <h2>Nuevo Veterinario</h2>
    </div>
    <form class="singup-form">

      <div class="group-singup">
        <label for="numeroColegiado">
          Numero de colegiado:
        </label>
        <input type="text" name="numeroColegiado" [(ngModel)]="numeroColegiado" placeholder="13456785-E">
      </div>

      <div class="group-singup">
        <label for="name">
          Nombre:
        </label>
        <input type="text" name="name" [(ngModel)]="nombre" placeholder="Paco">
      </div>

      <div class="group-singup">
        <label for="apellidos">
          Apellidos:
        </label>
        <input type="text" name="apellidos" [(ngModel)]="apellidos" placeholder="Sanchez Pérez">
      </div>

      <div class="group-singup">
        <label for="telefono">
          Teléfono:
        </label>
        <input type="text" name="telefono" [(ngModel)]="telefono" placeholder="633421443">
      </div>

      <div class="group-singup">
        <label for="email">
          Email:
        </label>
        <input type="email" name="email" [(ngModel)]="email" placeholder="dueño@gmail.com">
      </div>

      <div class="group-singup">
        <label for="fechaNacimeniento">
          Fecha nacimiento:
        </label>
        <input type="date" name="fechaNacimeniento" [(ngModel)]="fechaNacimeniento" >
      </div>

      <div class="group-singup width">
        <label for="fotoUrl" >
          Foto veterinario:
        </label>
        <input type="file"  name="fotoUrl" accept="image/*" (change)="onFileSelected($event)" >
      </div>

      <button type="button" class="btn-singup" (click)="onGuardar()">
        Guardar
      </button>

      <button type="button" class="btn-singup" (click)="onClose()"  >
        Cancelar
      </button>
    </form>

  </div>
</div>
