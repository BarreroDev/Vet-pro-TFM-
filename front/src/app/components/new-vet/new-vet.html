

<div class="backdrop">
  <div class="card-singup">
    <div class="singup-header">
      <h2>Nuevo Veterinario</h2>
    </div>
    <form class="singup-form" (ngSubmit)="onGuardar()">

      <div class="group-singup">
        <label for="numeroColegiado">
          Numero de colegiado:
        </label>
        <input type="text" name="numeroColegiado" [(ngModel)]="numeroColegiado" placeholder="COL-23400">
      </div>

      <div class="group-singup">
        <label for="name">
          Nombre:
        </label>
        <input type="text" name="name" [(ngModel)]="nombre" placeholder="Paco">
      </div>

      <div class="group-singup">
        <label for="apellidos">
          Apellidos:
        </label>
        <input type="text" name="apellidos" [(ngModel)]="apellidos" placeholder="Sanchez Pérez">
      </div>

      <div class="group-singup">
        <label for="telefono">
          Teléfono:
        </label>
        <input type="text" name="telefono" [(ngModel)]="telefono" placeholder="633421443">
      </div>

      <div class="group-singup">
        <label for="email">
          Email:
        </label>
        <input type="email" name="email" [(ngModel)]="email" placeholder="dueño@gmail.com">
      </div>

      <div class="group-singup">
        <label for="password">
          Contraseña:
        </label>
        <input type="password" name="password" [(ngModel)]="password">
      </div>

      <div class="group-singup">
        <label for="fechaNacimiento">
          Fecha nacimiento:
        </label>
        <input type="date" name="fechaNacimiento" [(ngModel)]="fechaNacimiento" >
      </div>

      <div class="group-singup">
        <label for="rol ">
          Rol:
        </label>
        <select name="rol" [(ngModel)]="rol">
          <option value="" disabled selected>Selecciona Rol</option>
          <option value="VETERINARIO">Veterinario</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      <div class="group-singup width">
        <label for="fotoUrl" >
          Foto veterinario:
        </label>
        <input type="file"  name="fotoUrl" accept="image/*" (change)="onFileSelected($event)" >
      </div>

      <div class="group-singup2">
        <button type="submit" class="btn-singup" >
          Guardar
        </button>

        <button type="button" class="btn-singup" (click)="onClose()"  >
          Cancelar
        </button>
      </div>

    </form>

  </div>
</div>
