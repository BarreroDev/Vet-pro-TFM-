<header class="top-bar">
  <div class="top-bar-left">
    <button type="button" class="btn-hamburger" (click)="toggleMenu()">
      ☰
    </button>

    <img src="/assets/img/logo-fondo-azul.jpg" alt="logo">
  </div>

  <div class="title">
    <h1>{{title}}</h1>
  </div>


  <button type="button" class="btn-logout" (click)="logout()">
    Cerrar sesión
  </button>

  <nav class="dropdown-menu" [class.show]="isMenuOpen">
    <a routerLink="/citas" (click)="closeMenu()">📅 Citas</a>
    <a routerLink="/duenos" (click)="closeMenu()">👤 Dueños</a>
    <a routerLink="/mascotas" (click)="closeMenu()">🐾 Mascotas</a>
    <a routerLink="/veterinarios" (click)="closeMenu()">🩺 Veterinarios</a>
  </nav>
</header>

@if (isMenuOpen) {
  <div class="backdrop-menu" (click)="closeMenu()"></div>
}

<div class="line"></div>
